import groovy.json.JsonSlurper
import java.io.File
import java.nio.file.Files
import java.security.MessageDigest

group 'com.tntlikely.libmpv_xplayer'
version '1.0'

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

android {
    // Conditional for compatibility with AGP <4.2.
    if (project.android.hasProperty("namespace")) {
        namespace 'com.tntlikely.libmpv_xplayer'
    }

    compileSdkVersion 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    defaultConfig {
        minSdkVersion 16
    }

}

// XPlayer: package all decoders using immutable, SHA-256 pinned upstream builds.
def nativeBuild = new JsonSlurper().parse(file("../native_builds.json")).android
def outputDir = file("$buildDir/full-output")
def downloadDependencies = tasks.register("downloadDependencies") {
    inputs.file(file("../native_builds.json"))
    outputs.dir(outputDir)
    doLast {
        outputDir.mkdirs()
        nativeBuild.artifacts.each { artifact ->
            def cacheFile = file("$buildDir/${nativeBuild.version}/${artifact.name}")
            def sha256 = { f ->
                MessageDigest.getInstance("SHA-256").digest(Files.readAllBytes(f.toPath())).encodeHex().toString()
            }
            if (!cacheFile.exists() || sha256(cacheFile) != artifact.sha256) {
                cacheFile.parentFile.mkdirs()
                def temporary = file("${cacheFile}.part")
                def connection = new URL(artifact.url).openConnection()
                connection.connectTimeout = 15000
                connection.readTimeout = 60000
                temporary.withOutputStream { out ->
                    connection.inputStream.withCloseable { input -> out << input }
                }
                if (sha256(temporary) != artifact.sha256) {
                    temporary.delete()
                    throw new GradleException("SHA-256 verification failed for ${artifact.name}")
                }
                Files.move(temporary.toPath(), cacheFile.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
            }
            copy { from cacheFile; into outputDir }
        }
    }
}
preBuild.dependsOn(downloadDependencies)

// Preserve the producer dependency for application desugaring and JNI merging.
dependencies {
    implementation files(fileTree(dir: outputDir, include: "*.jar")).builtBy(downloadDependencies)
}
