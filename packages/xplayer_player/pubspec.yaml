name: xplayer_player
description: Cross-platform Flutter playback with complete native decoders, live source handling, bounded fallback policy and audio session coordination.
version: 0.1.0-beta.1
repository: https://github.com/TNT-Likely/xplayer/tree/main/packages/xplayer_player
homepage: https://github.com/TNT-Likely/xplayer
issue_tracker: https://github.com/TNT-Likely/xplayer/issues
publish_to: https://pub.dev
resolution: workspace

environment:
  sdk: '>=3.11.0 <4.0.0'
  flutter: '>=3.41.0'

dependencies:
  # Upstream ranges admit releases using typed-data views removed in Dart 3.5.
  # These floors keep the declared lowest resolution usable with Dart 3.11.
  archive: '>=3.6.1 <5.0.0'
  audio_session: '>=0.2.4 <0.3.0'
  flutter:
    sdk: flutter
  media_kit: '>=1.2.6 <1.3.0'
  media_kit_video: '>=2.0.1 <2.1.0'
  libmpv_xplayer: ^0.1.0-beta.1
  win32: '>=5.5.1 <6.0.0'

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  path_provider: ^2.1.5
