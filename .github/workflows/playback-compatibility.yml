name: Playback decoder compatibility

on:
  pull_request:
    paths:
      - 'packages/**'
      - 'tool/**'
      - 'pubspec.*'
      - 'windows/**'
      - 'lib/services/player/**'
      - 'test/player/**'
      - '.github/workflows/playback-compatibility.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  decoders:
    defaults:
      run:
        working-directory: packages/xplayer_player
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          cache: true
      - name: Install Linux native decoder
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libmpv-dev
      - run: flutter pub get
      - name: Check player policy and shipping library pins
        run: flutter test
      - name: Analyze independent package
        run: flutter analyze
      - name: Install fixture encoder
        run: python -m pip install imageio-ffmpeg==0.6.0
      - name: Generate codec fixtures
        shell: bash
        run: |
          FFMPEG_BIN=$(python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')
          python tool/generate_playback_fixtures.py --output "${RUNNER_TEMP}/codec-fixtures" --ffmpeg "$FFMPEG_BIN"
      - name: Verify audio and video decoding
        shell: bash
        run: python tool/check_decoder_compatibility.py --fixtures "${RUNNER_TEMP}/codec-fixtures" --report "${RUNNER_TEMP}/decoder-report.json"
      - name: Verify HTTP and HLS playback regressions
        shell: bash
        run: python tool/check_stream_transport.py --fixtures "${RUNNER_TEMP}/codec-fixtures" --report "${RUNNER_TEMP}/transport-report.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: decoder-report-${{ runner.os }}
          path: |
            ${{ runner.temp }}/decoder-report.json
            ${{ runner.temp }}/transport-report.json
