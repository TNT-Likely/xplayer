<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#15161A; color:#E9ECEF; font-family:'PingFang SC','Noto Sans SC',sans-serif; -webkit-font-smoothing:antialiased; padding:52px 48px 90px; }
.head h1 { font-size:26px; font-weight:750; }
.head h1 em { font-style:normal; color:#8A8F9C; font-weight:600; }
.head p { margin-top:10px; font-size:14px; line-height:1.8; color:#9BA0AC; max-width:880px; }
.head p b { color:#C9CDD6; font-weight:600; }
.board-wrap { margin-top:44px; display:flex; flex-direction:column; gap:52px; max-width:1900px; }
figure.ls-fig { display:flex; flex-direction:column; gap:14px; }
figcaption { font-size:13px; color:#8A90A0; line-height:1.7; }
figcaption b { color:#E9ECEF; font-weight:650; margin-right:10px; }
.ldevice { width:876px; border-radius:46px; padding:12px; background:#000; box-shadow:0 20px 50px rgba(0,0,0,.5), inset 0 0 0 1.5px #2C2F35; align-self:flex-start; }
.lscreen { width:852px; height:393px; border-radius:34px; overflow:hidden; position:relative; background:var(--bg); color:var(--tx); }
.dir-a { --bg:#0A0C0B; --panel:#121614; --panel2:#171C19; --line:#232925; --line2:#2C342F; --tx:#F2F5F3; --tx2:#98A69D; --tx3:#5C685F; --acc:#00DC82; --acc-ink:#04150C; --live:#FF453A; --mono:'Spline Sans Mono',monospace; --radius:12px; font-family:'Archivo','PingFang SC','Noto Sans SC',sans-serif; }
.dir-b { --bg:#0D1220; --panel:rgba(255,255,255,.055); --panel-solid:#151C2E; --line:rgba(255,255,255,.09); --line2:rgba(255,255,255,.14); --tx:#EEF2FB; --tx2:#8B94AD; --tx3:#5C6580; --acc:#FFB347; --acc-ink:#241503; --live:#FF453A; --mono:'Manrope',sans-serif; --radius:14px; font-family:'Manrope','PingFang SC','Noto Sans SC',sans-serif; }
.dir-c { --bg:#0B0E11; --panel:#10151B; --panel2:#141B23; --line:#1B232D; --line2:#243040; --tx:#E8EDF2; --tx2:#7C8B99; --tx3:#4E5D6C; --acc:#3B9EFF; --acc-ink:#04121F; --live:#FF453A; --mono:'Chivo Mono',monospace; --radius:10px; font-family:'Barlow','PingFang SC','Noto Sans SC',sans-serif; }
.dir-d { --bg:#08090C; --panel:#0F1116; --panel2:#14161D; --line:#1D2029; --line2:#272B37; --tx:#F4F4F6; --tx2:#8A8E9A; --tx3:#565B68; --acc:#F0568C; --acc-ink:#1B0710; --live:#FF453A; --mono:'Doto',monospace; --radius:6px; font-family:'Archivo','PingFang SC','Noto Sans SC',sans-serif; }
/* 横屏播放器 */
.lp-vid { position:absolute; inset:0; }
.lp-vid svg { width:100%; height:100%; }
.lp-grad { position:absolute; inset:0; background:linear-gradient(180deg, rgba(0,0,0,.6), rgba(0,0,0,0) 24%, rgba(0,0,0,0) 46%, rgba(0,0,0,.86)); }
.lp-top { position:absolute; top:0; left:0; right:0; display:flex; align-items:center; gap:12px; padding:16px 24px 0; z-index:5; }
.lp-back { width:40px; height:40px; border-radius:var(--radius); background:rgba(255,255,255,.1); backdrop-filter:blur(8px); display:grid; place-items:center; flex:none; }
.lp-back svg { width:17px; height:17px; }
.lp-logo { width:44px; height:30px; border-radius:7px; background:var(--panel2); border:1px solid var(--line2); display:grid; place-items:center; flex:none; }
.lp-name { font-size:16px; font-weight:700; }
.lp-g { font-size:12px; color:rgba(255,255,255,.5); margin-top:1px; }
.lp-live { display:flex; align-items:center; gap:5px; font-family:var(--mono); font-size:10.5px; letter-spacing:.12em; font-weight:600; }
.lp-live i { width:6px; height:6px; border-radius:50%; background:var(--live); }
.lp-right { margin-left:auto; display:flex; align-items:center; gap:12px; }
.lp-hd { font-family:var(--mono); font-size:10.5px; background:rgba(255,255,255,.12); border-radius:7px; padding:5px 8px; }
.lp-clock { font-family:var(--mono); font-size:12px; color:rgba(255,255,255,.7); }
.lp-bottom { position:absolute; left:0; right:0; bottom:0; padding:0 24px 18px; z-index:5; }
.lp-titlerow { display:flex; align-items:baseline; gap:12px; }
.lp-titlerow .t { font-size:15.5px; font-weight:700; }
.lp-titlerow .r { font-family:var(--mono); font-size:11px; color:rgba(255,255,255,.5); }
.lp-titlerow .chips { margin-left:auto; display:flex; gap:7px; }
.lp-titlerow .chips span { font-size:11px; color:rgba(255,255,255,.75); background:rgba(255,255,255,.1); border-radius:7px; padding:5px 9px; }
.lp-bar { margin-top:10px; height:4px; border-radius:2px; background:rgba(255,255,255,.16); position:relative; }
.lp-bar .buf { position:absolute; inset:0 auto 0 0; width:82%; background:rgba(255,255,255,.26); border-radius:2px; }
.lp-bar .cur { position:absolute; inset:0 auto 0 0; width:76%; background:var(--acc); border-radius:2px; }
.lp-bar .thumb { position:absolute; top:50%; left:76%; width:12px; height:12px; border-radius:50%; background:#fff; transform:translate(-50%,-50%); box-shadow:0 0 0 4px color-mix(in srgb, var(--acc) 25%, transparent); }
.lp-times { display:flex; justify-content:space-between; margin-top:6px; font-family:var(--mono); font-size:10.5px; color:rgba(255,255,255,.5); }
.lp-ctrl { display:flex; align-items:center; margin-top:12px; }
.lp-ctrl .ch { display:flex; flex-direction:column; align-items:center; gap:1px; width:56px; height:44px; justify-content:center; border-radius:var(--radius); background:rgba(255,255,255,.09); font-family:var(--mono); font-size:9px; color:rgba(255,255,255,.55); }
.lp-ctrl .pp { width:52px; height:52px; border-radius:50%; background:#fff; color:#0A0C0B; display:grid; place-items:center; margin:0 14px; }
.dir-b .lp-ctrl .pp, .dir-d .lp-ctrl .pp { background:var(--acc); color:var(--acc-ink); }
.lp-ctrl .icons { margin-left:auto; display:flex; gap:6px; }
.lp-ctrl .icons span { width:36px; height:36px; border-radius:var(--radius); background:rgba(255,255,255,.09); display:grid; place-items:center; color:rgba(255,255,255,.78); }
.lp-ctrl .icons span.on { color:var(--acc); }
.lp-ctrl .icons svg { width:15px; height:15px; }
/* 横屏首页 */
.lh-status { height:26px; flex:none; display:flex; align-items:center; justify-content:space-between; padding:6px 24px 0; font-size:12px; font-weight:650; font-family:var(--mono); }
.lh-status .r { display:flex; gap:6px; align-items:center; }
.lh-top { display:flex; align-items:center; gap:12px; padding:8px 24px 10px; }
.lh-top .mark { font-weight:800; font-stretch:125%; letter-spacing:.12em; font-size:15px; }
.lh-top .mark em { font-style:normal; color:var(--acc); }
.lh-top .grow { flex:1; }
.lh-top .ic { width:36px; height:36px; border-radius:var(--radius); border:1px solid var(--line); background:var(--panel); display:grid; place-items:center; color:var(--tx2); }
.lh-top .ic svg { width:15px; height:15px; }
.lh-chips { display:flex; gap:8px; padding:0 24px 10px; overflow:hidden; }
.lh-chips span { flex:none; font-size:12px; padding:7px 13px; border-radius:99px; border:1px solid var(--line); background:var(--panel); color:var(--tx2); }
.lh-chips span.on { background:var(--acc); border-color:var(--acc); color:var(--acc-ink); font-weight:650; }
.lh-grid { display:grid; grid-template-columns:1fr 1fr 1fr 1fr; gap:10px; padding:0 24px; flex:1; min-height:0; overflow:hidden; align-content:start; }
.lh-card { border-radius:var(--radius); border:1px solid var(--line); background:var(--panel); overflow:hidden; }
.lh-card .lg { height:74px; display:grid; place-items:center; background:var(--panel2); position:relative; }
.lh-card .lg .fv { position:absolute; top:7px; right:8px; color:var(--tx3); }
.lh-card .lg .fv.on { color:var(--acc); }
.lh-card .nm { padding:7px 10px 2px; font-size:12.5px; font-weight:650; display:flex; gap:6px; align-items:center; }
.lh-card .nm .hd { margin-left:auto; font-family:var(--mono); font-size:8.5px; color:var(--tx3); border:1px solid var(--line2); border-radius:4px; padding:1px 4px; }
.lh-card .pg { padding:0 10px 8px; font-size:10px; color:var(--tx3); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.lh-card.next { opacity:.5; }
.lh-mini { margin:8px 24px 22px; flex:none; display:flex; align-items:center; gap:10px; border:1px solid var(--line2); background:var(--panel2); border-radius:var(--radius); padding:8px 10px; position:relative; overflow:hidden; }
.lh-mini .bar { position:absolute; top:0; left:0; right:0; height:2px; background:var(--line); }
.lh-mini .bar b { display:block; height:100%; width:76%; background:var(--acc); }
.lh-mini .pp { width:30px; height:30px; border-radius:50%; background:var(--acc); color:var(--acc-ink); display:grid; place-items:center; flex:none; }
.lh-mini .tt { flex:1; min-width:0; }
.lh-mini .tt .n { font-size:12px; font-weight:650; }
.lh-mini .tt .p { font-size:10px; color:var(--tx3); margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
</style>
</head>
