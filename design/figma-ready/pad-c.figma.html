.pstatus .r { display:flex; gap:8px; align-items:center; }
.padhome { position:absolute; bottom:7px; left:50%; transform:translateX(-50%); width:150px; height:5px; border-radius:3px; background:rgba(255,255,255,.75); z-index:60; }
.mono-a { font-family:'Spline Sans Mono',monospace; } .mono-c { font-family:'Chivo Mono',monospace; } .doto { font-family:'Doto',monospace; font-weight:700; }

<div class="head">
  <h1>Pad 横屏适配 <em>· 1194 × 834 · 4 方向对比</em></h1>
  <p>平板不是放大的手机：空间多了，信息组织就得换结构。四个方向各自的 pad 策略——<b>A</b> 右栏成为「正在播放 + 节目单」控制台；<b>B</b> 继续观看升为大幅海报主场；<b>C</b> 直接展开完整 EPG 时间轴（它的天然形态）；<b>D</b> 右栏常驻点阵 OSD 面板。点击 <a href="index.html" style="color:#7AA2FF;text-decoration:none">索引页</a> 回总览，TV 端见 <a href="tv.html" style="color:#7AA2FF;text-decoration:none">tv.html</a>。</p>
</div>
