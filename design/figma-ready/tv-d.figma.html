<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XPlayer · Android TV 适配 — 4 方向对比</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900&family=Manrope:wght@400;500;600;700;800&family=Barlow:wght@400;500;600;700&family=Chivo+Mono:wght@400;500;600;700&family=Doto:wght@400..900&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#15161A; color:#E9ECEF; font-family:'PingFang SC','Noto Sans SC','Helvetica Neue',sans-serif; -webkit-font-smoothing:antialiased; padding:52px 48px 90px; }
.head h1 { font-size:26px; font-weight:750; }
.head h1 em { font-style:normal; color:#8A8F9C; font-weight:600; }
.head p { margin-top:10px; font-size:14px; line-height:1.8; color:#9BA0AC; max-width:880px; }
.head p b { color:#C9CDD6; font-weight:600; }
.board-wrap { margin-top:44px; display:flex; flex-direction:column; gap:56px; max-width:1280px; }
figure.tv-fig { display:flex; flex-direction:column; gap:14px; }
figcaption { font-size:13px; color:#8A90A0; line-height:1.7; }
figcaption b { color:#E9ECEF; font-weight:650; margin-right:10px; }
.device { width:1105px; height:630px; overflow:hidden; border-radius:12px; padding:7px; background:#000; box-shadow:0 20px 50px rgba(0,0,0,.5), inset 0 0 0 1.5px #2C2F35; align-self:flex-start; }
.surface { width:1920px; height:1080px; transform:scale(.569); transform-origin:0 0; border-radius:6px; overflow:hidden; position:relative; background:var(--bg); color:var(--tx); }
.dir-a { --bg:#0A0C0B; --panel:#121614; --panel2:#171C19; --line:#232925; --line2:#2C342F; --tx:#F2F5F3; --tx2:#98A69D; --tx3:#5C685F; --acc:#00DC82; --acc-ink:#04150C; --live:#FF453A; font-family:'Archivo','PingFang SC','Noto Sans SC',sans-serif; }
.dir-b { --bg:#0D1220; --panel:rgba(255,255,255,.055); --panel-solid:#151C2E; --line:rgba(255,255,255,.09); --line2:rgba(255,255,255,.14); --tx:#EEF2FB; --tx2:#8B94AD; --tx3:#5C6580; --acc:#FFB347; --acc-ink:#241503; --live:#FF453A; font-family:'Manrope','PingFang SC','Noto Sans SC',sans-serif; }
.dir-c { --bg:#0B0E11; --panel:#10151B; --panel2:#141B23; --line:#1B232D; --line2:#243040; --tx:#E8EDF2; --tx2:#7C8B99; --tx3:#4E5D6C; --acc:#3B9EFF; --acc-ink:#04121F; --live:#FF453A; font-family:'Barlow','PingFang SC','Noto Sans SC',sans-serif; }
.dir-d { --bg:#08090C; --panel:#0F1116; --panel2:#14161D; --line:#1D2029; --line2:#272B37; --tx:#F4F4F6; --tx2:#8A8E9A; --tx3:#565B68; --acc:#F0568C; --acc2:#8C6CF0; --acc-ink:#1B0710; --live:#FF453A; font-family:'Archivo','PingFang SC','Noto Sans SC',sans-serif; }
.tv { width:1920px; height:1080px; display:flex; flex-direction:column; }
.doto { font-family:'Doto',monospace; font-weight:700; }
.tvhint { position:absolute; left:0; right:0; bottom:0; height:76px; display:flex; align-items:center; gap:34px; padding:0 80px; border-top:1px solid var(--line); background:rgba(0,0,0,.35); backdrop-filter:blur(8px); font-size:19px; color:var(--tx2); z-index:30; }
.tvhint .k { display:inline-flex; align-items:center; gap:9px; }
.tvhint .k i { font-style:normal; font-family:'Chivo Mono',monospace; font-size:15px; border:1px solid var(--line2); border-radius:7px; padding:3px 9px; color:var(--tx); background:var(--panel); }
.foctag { position:absolute; z-index:40; font-size:15px; letter-spacing:.06em; color:#E9ECEF; background:#20232B; border:1px dashed #4A4F5A; border-radius:99px; padding:7px 15px; }
</style>
</head>
<body>
<div class="head">
  <h1>Android TV 适配 <em>· 1920 × 1080 · 4 方向对比</em></h1>
  <p>TV 是十英尺界面：一切靠 D-pad 焦点驱动，字号、间距、焦点环都要放大到沙发上看得清。四个方向共同的 TV 骨架——顶栏（源 / 搜索 / 时钟）+ 底部按键提示条；差别在内容结构：<b>A</b> 侧栏分组 + 直播大横幅 + 焦点网格；<b>B</b> 沉浸海报行 + 暖光氛围；<b>C</b> 左列表右预览的经典机顶盒双栏；<b>D</b> 巨大点阵频道号做环境层 + 全宽跑马灯。每屏都标注了焦点态示意。</p>
</div>
<div class="board-wrap">

<figure class="tv-fig">
    <div class="device"><div class="surface dir-d d-tv">
      <div class="tv">
        <div class="d-tv-bignum">01</div>
        <div class="d-tv-top">
          <div class="mark">X<em>PLAYER</em></div>
          <span class="now"><i></i>NOW ON AIR</span>
          <div class="grow"></div>
          <span class="clock">20:47</span>
        </div>
        <div class="d-tv-body">
          <div class="d-tv-grid">
            <div class="d-tcell foc"><span class="num">01</span><span class="fv on"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-7.5-4.6-10-9.3C.5 8 2.6 4.5 6.2 4.5c2.2 0 3.9 1.2 4.8 3 .9-1.8 2.6-3 4.8-3 3.6 0 5.7 3.5 4.2 7.2C17.5 16.4 12 21 12 21z"/></svg></span><div class="pic"><svg width="120" height="52" viewBox="0 0 120 52"><rect width="64" height="52" rx="6" fill="#1E2622"/><text x="32" y="33" text-anchor="middle" font-family="Archivo,sans-serif" font-weight="800" font-size="20" fill="#F4F4F6">CCTV</text><rect x="68" width="52" height="52" rx="6" fill="#00DC82"/><text x="94" y="35" text-anchor="middle" font-family="Archivo,sans-serif" font-weight="800" font-size="26" fill="#04150C">1</text></svg></div><div class="nm">CCTV-1 综合</div></div>
            <div class="d-tcell"><span class="num">05</span><div class="pic"><svg width="120" height="52" viewBox="0 0 120 52"><rect width="64" height="52" rx="6" fill="#1E2622"/><text x="32" y="33" text-anchor="middle" font-family="Archivo,sans-serif" font-weight="800" font-size="20" fill="#F4F4F6">CCTV</text><rect x="68" width="52" height="52" rx="6" fill="#3E8E5A"/><text x="94" y="35" text-anchor="middle" font-family="Archivo,sans-serif" font-weight="800" font-size="26" fill="#06170D">5</text></svg></div><div class="nm">CCTV-5 体育</div></div>
            <div class="d-tcell"><span class="num">13</span><div class="pic"><svg width="120" height="52" viewBox="0 0 120 52"><rect width="64" height="52" rx="6" fill="#1E2622"/><text x="32" y="33" text-anchor="middle" font-family="Archivo,sans-serif" font-weight="800" font-size="20" fill="#F4F4F6">CCTV</text><rect x="68" width="52" height="52" rx="6" fill="#C99A2E"/><text x="94" y="35" text-anchor="middle" font-family="Archivo,sans-serif" font-weight="800" font-size="26" fill="#1A1204">13</text></svg></div><div class="nm">CCTV-13 新闻</div></div>
            <div class="d-tcell"><span class="num">28</span><div class="pic"><svg width="130" height="52" viewBox="0 0 130 52"><rect x="0" y="0" width="56" height="52" rx="6" fill="#D6402C"/><text x="28" y="33" text-anchor="middle" font-family="'PingFang SC',sans-serif" font-weight="700" font-size="22" fill="#fff">湖南</text><text x="70" y="33" font-family="'PingFang SC',sans-serif" font-weight="600" font-size="20" fill="#F4F4F6">卫视</text></svg></div><div class="nm">湖南卫视</div></div>
            <div class="d-tcell"><span class="num">29</span><div class="pic"><svg width="130" height="52" viewBox="0 0 130 52"><rect x="0" y="0" width="56" height="52" rx="6" fill="#1D5FA8"/><text x="28" y="33" text-anchor="middle" font-family="'PingFang SC',sans-serif" font-weight="700" font-size="22" fill="#fff">东方</text><text x="70" y="33" font-family="'PingFang SC',sans-serif" font-weight="600" font-size="20" fill="#F4F4F6">卫视</text></svg></div><div class="nm">东方卫视</div></div>
            <div class="d-tcell"><span class="num">06</span><div class="pic"><svg width="120" height="52" viewBox="0 0 120 52"><rect width="64" height="52" rx="6" fill="#1E2622"/><text x="32" y="33" text-anchor="middle" font-family="Archivo,sans-serif" font-weight="800" font-size="20" fill="#F4F4F6">CCTV</text><rect x="68" width="52" height="52" rx="6" fill="#C99A2E"/><text x="94" y="35" text-anchor="middle" font-family="Archivo,sans-serif" font-weight="800" font-size="26" fill="#1A1204">6</text></svg></div><div class="nm">CCTV-6 电影</div></div>
            <div class="d-tcell" style="opacity:.5"><span class="num">09</span><div class="pic"><svg width="120" height="52" viewBox="0 0 120 52"><rect width="64" height="52" rx="6" fill="#1E2622"/><text x="32" y="33" text-anchor="middle" font-family="Archivo,sans-serif" font-weight="800" font-size="20" fill="#F4F4F6">CCTV</text><rect x="68" width="52" height="52" rx="6" fill="#3E8E5A"/><text x="94" y="35" text-anchor="middle" font-family="Archivo,sans-serif" font-weight="800" font-size="26" fill="#06170D">9</text></svg></div><div class="nm">CCTV-9 纪录</div></div>
            <div class="d-tcell" style="opacity:.5"><span class="num">22</span><div class="pic"><svg width="130" height="52" viewBox="0 0 130 52"><rect x="0" y="0" width="56" height="52" rx="6" fill="#7A5CA8"/><text x="28" y="33" text-anchor="middle" font-family="'PingFang SC',sans-serif" font-weight="700" font-size="22" fill="#fff">浙江</text><text x="70" y="33" font-family="'PingFang SC',sans-serif" font-weight="600" font-size="20" fill="#F4F4F6">卫视</text></svg></div><div class="nm">浙江卫视</div></div>
          </div>
        </div>
        <div class="d-ticker3">
          <span class="tag"><i></i>NOW</span>
          <div class="strip"><span>20:47 晚间剧场《归途》第 14 集 · CCTV-1&nbsp;&nbsp;&nbsp;·&nbsp;&nbsp;&nbsp;20:50 世预赛半场数据 · CCTV-5+&nbsp;&nbsp;&nbsp;·&nbsp;&nbsp;&nbsp;21:00 新闻夜线 · CCTV-13&nbsp;&nbsp;&nbsp;·&nbsp;&nbsp;&nbsp;21:32 天气预报&nbsp;&nbsp;&nbsp;·&nbsp;&nbsp;&nbsp;21:45 体育世界 · CCTV-5&nbsp;&nbsp;&nbsp;·&nbsp;&nbsp;&nbsp;20:47 晚间剧场《归途》第 14 集 · CCTV-1&nbsp;&nbsp;&nbsp;·&nbsp;&nbsp;&nbsp;20:50 世预赛半场数据 · CCTV-5+&nbsp;&nbsp;&nbsp;·&nbsp;&nbsp;&nbsp;21:00 新闻夜线 · CCTV-13&nbsp;&nbsp;&nbsp;·&nbsp;&nbsp;&nbsp;21:32 天气预报&nbsp;&nbsp;&nbsp;·&nbsp;&nbsp;&nbsp;21:45 体育世界 · CCTV-5</span></div>
        </div>
        <div class="tvhint">
          <span class="k"><i>OK</i>播放</span>
          <span class="k"><i>CH− / CH+</i>换台</span>
          <span class="k"><i>0-9</i>直达频道号</span>
          <span class="k"><i>MENU</i>分组</span>
          <span class="k" style="margin-left:auto;color:var(--tx3)">背景层：当前频道号点阵化常驻</span>
        </div>
      </div>
    </div></div>
    <figcaption><b>D · 点阵 OSD</b>巨大的点阵「01」沉在背景层（随换台变化），焦点卡白环 + 品红辉光，底部全宽跑马灯——TV 上最像「电视」的一版。</figcaption>
  </figure>
</div>

<script>
/* figma=1 干净导出模式：隐藏工作台外壳，屏幕按画布排布，取消缩放 */
if (true) {
  document.documentElement.classList.add('figma-mode');
  const css = `
    .deck-head, .pghead, .head, .note, figcaption, .deck-meta { display:none !important; }
    body { background:#0B0C10 !important; padding:64px !important; width:2050px !important; }
    .deck, .deck.small, .board-wrap { display:flex !important; flex-wrap:wrap; gap:56px !important; padding:0 !important; max-width:none !important; }
    .phone, .device, .mdev { width:auto !important; height:auto !important; overflow:visible !important; box-shadow:none !important; }
    .mscr, .surface { transform:none !important; }
  `;
  const st = document.createElement('style');
  st.textContent = css;
  document.head.appendChild(st);
}
</script>
</body>
</html>
