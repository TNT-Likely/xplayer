<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XPlayer · Android TV 适配 — 4 方向对比</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900&family=Manrope:wght@400;500;600;700;800&family=Barlow:wght@400;500;600;700&family=Chivo+Mono:wght@400;500;600;700&family=Doto:wght@400..900&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#15161A; color:#E9ECEF; font-family:'PingFang SC','Noto Sans SC','Helvetica Neue',sans-serif; -webkit-font-smoothing:antialiased; padding:52px 48px 90px; }
.head h1 { font-size:26px; font-weight:750; }
.head h1 em { font-style:normal; color:#8A8F9C; font-weight:600; }
.head p { margin-top:10px; font-size:14px; line-height:1.8; color:#9BA0AC; max-width:880px; }
.head p b { color:#C9CDD6; font-weight:600; }
.board-wrap { margin-top:44px; display:flex; flex-direction:column; gap:56px; max-width:1280px; }
figure.tv-fig { display:flex; flex-direction:column; gap:14px; }
figcaption { font-size:13px; color:#8A90A0; line-height:1.7; }
figcaption b { color:#E9ECEF; font-weight:650; margin-right:10px; }
.device { width:1105px; height:630px; overflow:hidden; border-radius:12px; padding:7px; background:#000; box-shadow:0 20px 50px rgba(0,0,0,.5), inset 0 0 0 1.5px #2C2F35; align-self:flex-start; }
.surface { width:1920px; height:1080px; transform:scale(.569); transform-origin:0 0; border-radius:6px; overflow:hidden; position:relative; background:var(--bg); color:var(--tx); }
.dir-a { --bg:#0A0C0B; --panel:#121614; --panel2:#171C19; --line:#232925; --line2:#2C342F; --tx:#F2F5F3; --tx2:#98A69D; --tx3:#5C685F; --acc:#00DC82; --acc-ink:#04150C; --live:#FF453A; font-family:'Archivo','PingFang SC','Noto Sans SC',sans-serif; }
.dir-b { --bg:#0D1220; --panel:rgba(255,255,255,.055); --panel-solid:#151C2E; --line:rgba(255,255,255,.09); --line2:rgba(255,255,255,.14); --tx:#EEF2FB; --tx2:#8B94AD; --tx3:#5C6580; --acc:#FFB347; --acc-ink:#241503; --live:#FF453A; font-family:'Manrope','PingFang SC','Noto Sans SC',sans-serif; }
.dir-c { --bg:#0B0E11; --panel:#10151B; --panel2:#141B23; --line:#1B232D; --line2:#243040; --tx:#E8EDF2; --tx2:#7C8B99; --tx3:#4E5D6C; --acc:#3B9EFF; --acc-ink:#04121F; --live:#FF453A; font-family:'Barlow','PingFang SC','Noto Sans SC',sans-serif; }
.dir-d { --bg:#08090C; --panel:#0F1116; --panel2:#14161D; --line:#1D2029; --line2:#272B37; --tx:#F4F4F6; --tx2:#8A8E9A; --tx3:#565B68; --acc:#F0568C; --acc2:#8C6CF0; --acc-ink:#1B0710; --live:#FF453A; font-family:'Archivo','PingFang SC','Noto Sans SC',sans-serif; }
.tv { width:1920px; height:1080px; display:flex; flex-direction:column; }
.doto { font-family:'Doto',monospace; font-weight:700; }
.tvhint { position:absolute; left:0; right:0; bottom:0; height:76px; display:flex; align-items:center; gap:34px; padding:0 80px; border-top:1px solid var(--line); background:rgba(0,0,0,.35); backdrop-filter:blur(8px); font-size:19px; color:var(--tx2); z-index:30; }
.tvhint .k { display:inline-flex; align-items:center; gap:9px; }
.tvhint .k i { font-style:normal; font-family:'Chivo Mono',monospace; font-size:15px; border:1px solid var(--line2); border-radius:7px; padding:3px 9px; color:var(--tx); background:var(--panel); }
.foctag { position:absolute; z-index:40; font-size:15px; letter-spacing:.06em; color:#E9ECEF; background:#20232B; border:1px dashed #4A4F5A; border-radius:99px; padding:7px 15px; }
</style>
</head>
<body>
<div class="head">
  <h1>Android TV 适配 <em>· 1920 × 1080 · 4 方向对比</em></h1>
  <p>TV 是十英尺界面：一切靠 D-pad 焦点驱动，字号、间距、焦点环都要放大到沙发上看得清。四个方向共同的 TV 骨架——顶栏（源 / 搜索 / 时钟）+ 底部按键提示条；差别在内容结构：<b>A</b> 侧栏分组 + 直播大横幅 + 焦点网格；<b>B</b> 沉浸海报行 + 暖光氛围；<b>C</b> 左列表右预览的经典机顶盒双栏；<b>D</b> 巨大点阵频道号做环境层 + 全宽跑马灯。每屏都标注了焦点态示意。</p>
</div>
<div class="board-wrap">

<figure class="tv-fig">
    <div class="device"><div class="surface dir-c">
      <div class="tv">
        <div class="c-tv-top">

          <div class="grow"></div>
          <span class="clock">20:47 TUE</span>
        </div>
        <div class="c-tv-body">
          <div class="c-list">
            <div class="h"><b>央视频道</b>· 48 个<span class="all">切换分组 ▶</span></div>
            <div class="c-lr foc"><span class="no">01</span><div class="lg"><svg width="46" height="20" viewBox="0 0 46 20"><rect width="46" height="20" rx="4" fill="rgba(4,18,31,.2)"/><text x="23" y="14.5" text-anchor="middle" font-family="Barlow,sans-serif" font-weight="700" font-size="11" fill="#04121F">CCTV</text></svg></div><div class="in"><div class="n">CCTV-1 综合</div><div class="p">晚间剧场《归途》· 剩 13 分钟</div></div><span class="fv on"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-7.5-4.6-10-9.3C.5 8 2.6 4.5 6.2 4.5c2.2 0 3.9 1.2 4.8 3 .9-1.8 2.6-3 4.8-3 3.6 0 5.7 3.5 4.2 7.2C17.5 16.4 12 21 12 21z"/></svg></span></div>
            <div class="c-lr"><span class="no">02</span><div class="lg"><svg width="46" height="20" viewBox="0 0 46 20"><rect width="46" height="20" rx="4" fill="#1E2622"/><text x="23" y="14.5" text-anchor="middle" font-family="Barlow,sans-serif" font-weight="700" font-size="11" fill="#E8EDF2">CCTV</text></svg></div><div class="in"><div class="n">CCTV-2 财经</div><div class="p">经济信息联播</div></div><span class="fv"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20s-6.6-4-8.8-8.1C1.7 8.6 3.6 5.5 6.8 5.5c1.9 0 3.4 1 4.2 2.6.8-1.6 2.3-2.6 4.2-2.6 3.2 0 5.1 3.1 3.6 6.4C16.6 16 12 20 12 20z"/></svg></span></div>
            <div class="c-lr"><span class="no">03</span><div class="lg"><svg width="46" height="20" viewBox="0 0 46 20"><rect width="46" height="20" rx="4" fill="#1E2622"/><text x="23" y="14.5" text-anchor="middle" font-family="Barlow,sans-serif" font-weight="700" font-size="11" fill="#E8EDF2">CCTV</text></svg></div><div class="in"><div class="n">CCTV-5 体育</div><div class="p">世预赛亚洲区 · 中国 vs 澳大利亚</div></div><span class="fv on"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-7.5-4.6-10-9.3C.5 8 2.6 4.5 6.2 4.5c2.2 0 3.9 1.2 4.8 3 .9-1.8 2.6-3 4.8-3 3.6 0 5.7 3.5 4.2 7.2C17.5 16.4 12 21 12 21z"/></svg></span></div>
            <div class="c-lr"><span class="no">05</span><div class="lg"><svg width="46" height="20" viewBox="0 0 46 20"><rect width="46" height="20" rx="4" fill="#C99A2E"/><text x="23" y="14.5" text-anchor="middle" font-family="Barlow,sans-serif" font-weight="700" font-size="11" fill="#1A1204">C6</text></svg></div><div class="in"><div class="n">CCTV-6 电影</div><div class="p">光影星播客</div></div><span class="fv"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20s-6.6-4-8.8-8.1C1.7 8.6 3.6 5.5 6.8 5.5c1.9 0 3.4 1 4.2 2.6.8-1.6 2.3-2.6 4.2-2.6 3.2 0 5.1 3.1 3.6 6.4C16.6 16 12 20 12 20z"/></svg></span></div>
            <div class="c-lr"><span class="no">13</span><div class="lg"><svg width="46" height="20" viewBox="0 0 46 20"><rect width="46" height="20" rx="4" fill="#1E2622"/><text x="23" y="14.5" text-anchor="middle" font-family="Barlow,sans-serif" font-weight="700" font-size="11" fill="#E8EDF2">CCTV</text></svg></div><div class="in"><div class="n">CCTV-13 新闻</div><div class="p">新闻直播间</div></div><span class="fv"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20s-6.6-4-8.8-8.1C1.7 8.6 3.6 5.5 6.8 5.5c1.9 0 3.4 1 4.2 2.6.8-1.6 2.3-2.6 4.2-2.6 3.2 0 5.1 3.1 3.6 6.4C16.6 16 12 20 12 20z"/></svg></span></div>
            <div class="c-lr"><span class="no">17</span><div class="lg"><svg width="46" height="20" viewBox="0 0 46 20"><rect width="46" height="20" rx="4" fill="#3E8E5A"/><text x="23" y="14.5" text-anchor="middle" font-family="Barlow,sans-serif" font-weight="700" font-size="11" fill="#06170D">C9</text></svg></div><div class="in"><div class="n">CCTV-9 纪录</div><div class="p">蓝色星球 · 深海</div></div><span class="fv"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20s-6.6-4-8.8-8.1C1.7 8.6 3.6 5.5 6.8 5.5c1.9 0 3.4 1 4.2 2.6.8-1.6 2.3-2.6 4.2-2.6 3.2 0 5.1 3.1 3.6 6.4C16.6 16 12 20 12 20z"/></svg></span></div>
          </div>
          <div class="c-prev">
            <div class="vid">
              <svg viewBox="0 0 1010 480" preserveAspectRatio="xMidYMid slice">
                <defs><linearGradient id="tc-b" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#10202F"/><stop offset="1" stop-color="#0A131C"/></linearGradient>
                <linearGradient id="tc-d" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#131E2A"/><stop offset="1" stop-color="#0C141D"/></linearGradient></defs>
                <rect width="1010" height="480" fill="url(#tc-b)"/>
                <rect x="66" y="70" width="13" height="130" rx="6.5" fill="#3B9EFF" opacity=".75"/>
                <circle cx="640" cy="150" r="62" fill="none" stroke="rgba(255,255,255,.13)" stroke-width="2"/><circle cx="640" cy="150" r="47" fill="none" stroke="rgba(59,158,255,.3)"/>
                <rect x="600" y="124" width="80" height="54" rx="9" fill="rgba(255,255,255,.06)"/>
                <rect x="614" y="137" width="36" height="6" rx="3" fill="rgba(255,255,255,.3)"/><rect x="614" y="150" width="54" height="5" rx="2.5" fill="rgba(255,255,255,.15)"/>
                <g opacity=".45" fill="#0D1826"><rect x="856" y="116" width="22" height="120"/><rect x="884" y="98" width="28" height="140"/></g>
                <path d="M0 292 Q505 262 1010 288" stroke="rgba(255,255,255,.09)" fill="none"/>
                <path d="M0 296 L1010 290 L1010 480 L0 480 Z" fill="url(#tc-d)"/>
                <path d="M0 294 Q505 264 1010 289" stroke="rgba(59,158,255,.45)" fill="none" stroke-width="2"/>
              </svg>
              <span class="lv"><i></i>LIVE</span>
              <div class="ch"><div class="n">CCTV-1 综合</div><div class="g">CH 01 · 央视频道 · 1080P</div></div>
            </div>
            <div class="epg">
              <div class="row cur"><span class="t">20:06 – 21:00</span><span class="n">晚间剧场《归途》第 14 集</span><span class="s">播至 76%</span></div>
              <div class="row"><span class="t">21:00 – 21:32</span><span class="n">新闻夜线</span><span class="s">30 分钟</span></div>
              <div class="row"><span class="t">21:32 – 21:45</span><span class="n">天气预报</span><span class="s">8 分钟</span></div>
              <div class="bar"><b></b></div>
            </div>
            <div class="acts">
              <span class="ok">OK 播放</span>
              <span>♡ 收藏</span>
              <span>节目单</span>
              <span>音轨 · 中</span>
            </div>
          </div>
        </div>
        <div class="tvhint" style="border-color:var(--line)">
          <span class="k"><i>OK</i>播放</span>
          <span class="k"><i>◀ ▶</i>切换频道</span>
          <span class="k"><i>◀◀</i>左栏分组</span>
          <span class="k"><i>EPG</i>时间轴</span>
          <span class="k" style="margin-left:auto;color:var(--tx3)">焦点态：左列表蓝条 + 右侧实时预览</span>
        </div>
      </div>
    </div></div>
    <figcaption><b>C · 频道指南</b>经典机顶盒双栏：左侧编号列表（焦点行蓝条填充），右侧被选中频道的实时预览 + 节目单 + OK 播放。换台决策最快的一版。</figcaption>
  </figure>
</div>

<script>
/* figma=1 干净导出模式：隐藏工作台外壳，屏幕按画布排布，取消缩放 */
if (true) {
  document.documentElement.classList.add('figma-mode');
  const css = `
    .deck-head, .pghead, .head, .note, figcaption, .deck-meta { display:none !important; }
    body { background:#0B0C10 !important; padding:64px !important; width:2050px !important; }
    .deck, .deck.small, .board-wrap { display:flex !important; flex-wrap:wrap; gap:56px !important; padding:0 !important; max-width:none !important; }
    .phone, .device, .mdev { width:auto !important; height:auto !important; overflow:visible !important; box-shadow:none !important; }
    .mscr, .surface { transform:none !important; }
  `;
  const st = document.createElement('style');
  st.textContent = css;
  document.head.appendChild(st);
}
</script>
</body>
</html>
